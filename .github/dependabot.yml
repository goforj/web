version: 2
# Keep consumers using local replacements aligned with the root module.
updates:
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/docs"
      - "/examples"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      monthly-go-updates:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      actions-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
