name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            docs/go.mod
            docs/go.sum
            examples/go.mod
            examples/go.sum

      - name: Verify module files are tidy
        run: |
          go mod tidy -diff
          (cd docs && GOWORK=off go mod tidy -diff)
          (cd examples && GOWORK=off go mod tidy -diff)

      - name: Download dependencies
        run: |
          go mod download
          (cd docs && GOWORK=off go mod download)
          (cd examples && GOWORK=off go mod download)

      - name: Run root tests
        run: go test ./... -v

      - name: Verify generated examples compile
        run: |
          cd examples
          GOWORK=off go test ./... -v

      - name: Verify documentation tooling
        run: |
          cd docs
          GOWORK=off go test ./... -v
          GOWORK=off go test -tags=benchrender ./... -v

      - name: Verify benchmark rendering matches the committed snapshot
        run: |
          make bench-svg-verify
          git diff --exit-code -- README.md docs/bench/benchmarks_rows.json docs/bench/framework_comparison.svg
          test -z "$(git ls-files --others --exclude-standard -- docs/bench/benchmarks_rows.json docs/bench/framework_comparison.svg)"

  race:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Run race tests
        run: go test -race ./...

  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            examples/go.mod
            examples/go.sum

      - name: Run combined coverage
        run: bash scripts/coverage-codecov.sh

      - name: Upload results to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: coverage.txt
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan full history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            docs/go.mod
            docs/go.sum
            examples/go.mod
            examples/go.sum

      - name: Scan every Go module for reachable vulnerabilities
        run: |
          GOWORK=off go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -test ./...
          (cd docs && GOWORK=off go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -test ./...)
          (cd examples && GOWORK=off go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -test ./...)
