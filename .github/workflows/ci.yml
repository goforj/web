name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            docs/go.mod
            docs/go.sum
            examples/go.mod
            examples/go.sum

      - name: Verify module files are tidy
        run: |
          go mod tidy -diff
          (cd docs && GOWORK=off go mod tidy -diff)
          (cd examples && GOWORK=off go mod tidy -diff)

      - name: Download dependencies
        run: |
          go mod download
          (cd docs && GOWORK=off go mod download)
          (cd examples && GOWORK=off go mod download)

      - name: Run root tests
        run: go test ./... -v

      - name: Verify generated examples compile
        run: |
          cd examples
          GOWORK=off go test ./... -v

      - name: Verify documentation tooling
        run: |
          cd docs
          GOWORK=off go test ./... -v
          GOWORK=off go test -tags=benchrender ./... -v

      - name: Verify benchmark rendering matches the committed snapshot
        run: |
          make bench-svg-verify
          git diff --exit-code -- README.md docs/bench/benchmarks_rows.json docs/bench/framework_comparison.svg
          test -z "$(git ls-files --others --exclude-standard -- docs/bench/benchmarks_rows.json docs/bench/framework_comparison.svg)"

  race:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Run race tests
        run: go test -race ./...

  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            examples/go.mod
            examples/go.sum

      - name: Run combined coverage
        run: bash scripts/coverage-codecov.sh

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.txt
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
