name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
          cache: false

      - name: Validate every Go module
        run: |
          mapfile -t modules < <(find . -type f -name go.mod -not -path './.git/*' -not -path './vendor/*' -print | LC_ALL=C sort)
          test "${#modules[@]}" -gt 0
          for module in "${modules[@]}"; do
            directory="$(dirname "$module")"
            (
              cd "$directory"
              GOWORK=off go mod tidy -diff
              GOWORK=off go mod download
              GOWORK=off go test ./... -v
              GOWORK=off go vet ./...
              if [ "$directory" = "./docs" ]; then
                GOWORK=off go test -tags=benchrender ./... -v
              fi
            )
          done

      - name: Verify benchmark rendering matches the committed snapshot
        run: |
          make bench-svg-verify
          git diff --exit-code -- README.md docs/bench/benchmarks_rows.json docs/bench/framework_comparison.svg
          test -z "$(git ls-files --others --exclude-standard -- docs/bench/benchmarks_rows.json docs/bench/framework_comparison.svg)"

  race:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
          cache: false

      - name: Run race tests for every Go module
        run: |
          mapfile -t modules < <(find . -type f -name go.mod -not -path './.git/*' -not -path './vendor/*' -print | LC_ALL=C sort)
          test "${#modules[@]}" -gt 0
          for module in "${modules[@]}"; do
            (
              cd "$(dirname "$module")"
              GOWORK=off go test -race ./...
            )
          done

  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
          cache: false

      - name: Run combined coverage
        run: bash scripts/coverage-codecov.sh

      - name: Upload results to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: coverage.txt
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false

      - name: Install Gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan full history for secrets
        run: gitleaks git --log-opts="--all" --redact --no-banner

      - name: Scan every Go module for reachable vulnerabilities
        run: |
          mapfile -t modules < <(find . -type f -name go.mod -not -path './.git/*' -not -path './vendor/*' -print | LC_ALL=C sort)
          test "${#modules[@]}" -gt 0
          for module in "${modules[@]}"; do
            (
              cd "$(dirname "$module")"
              GOWORK=off go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -test ./...
            )
          done

      - name: Generate and verify CycloneDX SBOMs
        run: |
          mapfile -t modules < <(find . -type f -name go.mod -not -path './.git/*' -not -path './vendor/*' -print | LC_ALL=C sort)
          test "${#modules[@]}" -gt 0
          output_directory="$RUNNER_TEMP/sbom"
          mkdir -p "$output_directory"
          for module in "${modules[@]}"; do
            directory="$(dirname "$module")"
            name="${directory#./}"
            if [ "$name" = "." ]; then
              name="root"
            fi
            output="$output_directory/${name//\//_}.cdx.json"
            (
              cd "$directory"
              GOWORK=off go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0 mod -json -output "$output" .
            )
            jq -e '.bomFormat == "CycloneDX" and (.specVersion | type == "string") and (.components | type == "array")' "$output" > /dev/null
          done
          generated="$(find "$output_directory" -type f -name '*.cdx.json' -print | wc -l | tr -d ' ')"
          test "$generated" -eq "${#modules[@]}"

      - name: Upload CycloneDX SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cyclonedx-sboms
          path: ${{ runner.temp }}/sbom/*.cdx.json
          if-no-files-found: error

  dependency-review:
    if: github.event_name == 'pull_request' && vars.ENABLE_GITHUB_ADVANCED_SECURITY == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: go
          build-mode: manual

      - name: Build every Go module
        run: |
          mapfile -t modules < <(find . -type f -name go.mod -not -path './.git/*' -not -path './vendor/*' -print | LC_ALL=C sort)
          test "${#modules[@]}" -gt 0
          for module in "${modules[@]}"; do
            (
              cd "$(dirname "$module")"
              GOWORK=off go build ./...
            )
          done

      - name: Analyze
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
